#This is the single project pyproject.toml

[build-system]
requires = ["setuptools>=67", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "gr00t"
version = "0.1.0"
requires-python = ">=3.10,<3.13,!=3.11.*"
# Python 3.10 is the SFT stack; Python 3.12 is the validated SDPA inference stack.
# Full transitive versions and CUDA package sources live in the lab environment locks.
dependencies = [
    "msgpack==1.1.0",
    "numpy==1.26.4; python_version == '3.10'",
    "numpy==2.3.1; python_version == '3.12'",
    "pyzmq==27.0.1",
]

[project.optional-dependencies]
# Remote clients do not load the policy model. Inference and training are separate uses.
inference = [
    "albumentations==1.4.18",
    "av==15.0.0; python_version == '3.10'",
    "av==15.1.0; python_version == '3.12'",
    "diffusers==0.35.1",
    "dm-tree==0.1.8",
    "lmdb==1.7.5",
    "msgpack-numpy==0.4.8",
    "pandas==2.2.3",
    "peft==0.17.1",
    "termcolor==3.2.0; python_version == '3.10'",
    "termcolor==3.3.0; python_version == '3.12'",
    "torch==2.7.1; python_version == '3.10'",
    "torch==2.11.0; python_version == '3.12'",
    "torchvision==0.22.1; python_version == '3.10'",
    "torchvision==0.26.0; python_version == '3.12'",
    "transformers==4.51.3",
    "tyro==0.9.17",
    "click==8.1.8; python_version == '3.10'",
    "click==8.1.7; python_version == '3.12'",
    "datasets==3.6.0",
    "einops==0.8.1; python_version == '3.10'",
    "einops==0.8.2; python_version == '3.12'",
    "gymnasium==1.2.2; python_version == '3.10'",
    "gymnasium==1.2.1; python_version == '3.12'",
    "matplotlib==3.10.1; python_version == '3.10'",
    "matplotlib==3.10.8; python_version == '3.12'",
    "omegaconf==2.3.0; python_version == '3.10'",
    "omegaconf==2.3.1; python_version == '3.12'",
    "scipy==1.15.3; python_version == '3.10'",
    "scipy==1.17.0; python_version == '3.12'",
    "torchcodec==0.4.0; python_version == '3.10'",
    "torchcodec==0.11.1; python_version == '3.12'",
    "wandb==0.23.0; python_version == '3.10'",
    "wandb==0.25.0; python_version == '3.12'",
]
# SFT remains on the Python 3.10 / FlashAttention stack.
sft = [
    "gr00t[inference]==0.1.0",
    "flash-attn==2.7.4.post1",
    "deepspeed==0.17.6",
]
dev = [
    "ruff",
    "ipython",
]
tensorrt = [
    "onnx>=1.20.0",
    "tensorrt>=10.14.1.48.post1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gr00t*"]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.7.0", "numpy==1.26.4"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["gr00t"]
exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".vscode",
    ".venv",
    "dist",
    "logs",
    "*.ipynb",
    "gr00t/model/modules/nvidia/Eagle-Block2A-2B-v2",
    "external_dependencies",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = false
split-on-trailing-comma = false
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
